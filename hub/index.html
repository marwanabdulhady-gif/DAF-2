<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dar Al Fikr · Grade 4 Mathematics Learning Hub</title>
  <link rel="stylesheet" href="hub.css">
</head>
<body>

  <div class="app" id="app">

    <!-- Sidebar: brand + dynamic navigation (rendered by hub.js into #nav) -->
    <aside class="sidebar">
      <div class="brand">
        <img src="assets/daf-logo.png" alt="Dar Al Fikr Schools" class="brand-logo-img">
        <div>
          <div class="brand-name">DAR AL FIKR SCHOOLS</div>
          <div class="brand-sub">Grade 4 Mathematics · 2026–2027</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <!-- Main column: glass topbar + routed views (rendered into #view) -->
    <div class="main">
      <header class="topbar">
        <button class="burger" id="burger" aria-label="Toggle navigation">☰</button>
        <div class="crumb" id="crumb">Grade 4 Mathematics</div>
        <div class="search">
          <input type="search" id="search" placeholder="Search lessons, gates, experiences…" autocomplete="off">
        </div>
        <button class="icon-btn" id="theme" title="Toggle dark / light theme" aria-label="Toggle theme">◐</button>
      </header>

      <main class="page" id="view"></main>
    </div>

  </div>

  <script src="hub.js"></script>
</body>
</html>
